name: Run Code Quality Checks

on:
  push:
    branches:
      - 'main'
  release:
    types: [released]
  pull_request:
    types:
      - 'ready_for_review'
      - 'opened'
      - 'synchronize'
  merge_group:
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check out pinned OmniAgents protocol source
        shell: bash
        run: |
          source_commit=$(node -p "require('./src/generated/omniagents-gui-v1/provenance.json').source_commit")
          git clone --filter=blob:none --no-checkout https://github.com/utrgv-software-engineering/omniagents.git ../omniagents-protocol-source
          git -C ../omniagents-protocol-source fetch --depth=1 origin "$source_commit"
          git -C ../omniagents-protocol-source checkout --detach "$source_commit"

      - name: Verify pinned OmniAgents protocol source
        run: npm run protocol:verify-source -- ../omniagents-protocol-source

      - name: Run code quality checks
        run: npm run lint
