name: Publish sandbox image

# Builds and publishes the devbox sandbox image from sandbox-image/.
# This supersedes omni-code's build-sandbox-images.yml (deleted with the
# Shape-A `omni sandbox` retirement): the launcher owns the image now.
# After the first successful publish, repoint the devbox profiles
# (launcher assets/profiles/devbox.yml and omni-code
# evaluations/profiles/devbox*.yml) from the legacy
# ghcr.io/ericmichael/omni-code-sandbox-work image to this one and
# re-pin digests.

on:
  push:
    branches: [main]
    paths:
      - 'sandbox-image/**'
      - '.github/workflows/publish-sandbox-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/omni-launcher-devbox

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: sandbox-image
          file: sandbox-image/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Print published digest
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest" | head -5
